baseURL = "https://example.com/"
title   = "Mini Blog"
theme   = "hugo-mini"

defaultContentLanguage              = "en"
defaultContentLanguageInSubdirectory = false

enableRobotsTXT = true
disableKinds    = ["taxonomy"]
ignoreErrors    = ["error-disable-taxonomy"]

[params]
  favicon    = "images/favicon.png"
  authorName = "Jane Doe"
  authorURL  = "https://example.com/"

  # Appearance
  avatar      = "images/avatar.svg"
  avatarHover = "images/avatar-hover.svg"

  # Footer
  copyrightYear = 2024   # start year: renders as "© 2024–CURRENT"

  # Content
  newPostDays = 30   # days before "New" badge disappears
  aiTranslatedLang = "ru"   # show AI sparkle icon on this language in the switcher

  # Telegram (remove to disable CTA and comments)
  # telegramChannel        = "your_channel"
  # telegramCTATitle       = "My Channel"
  # telegramCTADescription = "Follow for more content"

  # Features
  # socialSharing = false   # uncomment to disable Likely sharing buttons

  # Analytics
  # yandexMetrikaId = 123456789
  # googleAnalyticsId = "G-XXXXXXXXXX"

  [params.author]
    jobTitle = "Product Manager"

  [params.social]
    telegram = "https://t.me/janedoe"
    github   = "https://github.com/janedoe"
    email    = "jane@example.com"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true   # required for shortcodes and HTML in content

[languages]
  [languages.en]
    weight = 1
    languageName = "EN"
    contentDir = "content/en"
    [languages.en.permalinks]
      blog = "/:slug/"
    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "blog"
        name       = "Articles"
        url        = "/blog/"
        weight     = 1
      [[languages.en.menu.main]]
        identifier = "about"
        name       = "About"
        url        = "/about/"
        weight     = 2

  [languages.ru]
    weight = 2
    languageName = "RU"
    contentDir = "content/ru"
    [languages.ru.permalinks]
      blog = "/:slug/"
    [languages.ru.menu]
      [[languages.ru.menu.main]]
        identifier = "blog"
        name       = "Статьи"
        url        = "/ru/blog/"
        weight     = 1
      [[languages.ru.menu.main]]
        identifier = "about"
        name       = "О проекте"
        url        = "/ru/about/"
        weight     = 2
