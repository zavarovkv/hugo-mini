baseURL = "https://example.com/"
title   = "Mini Blog"
theme   = "hugo-mini"

defaultContentLanguage              = "en"
defaultContentLanguageInSubdirectory = false

enableRobotsTXT = true
disableKinds    = ["taxonomy", "term"]
ignoreErrors    = ["error-disable-taxonomy"]

# JSON Feed (/index.json) and llms.txt for AI crawlers. Both are rendered by
# the theme (layouts/home.json, layouts/home.llms.txt) but only emitted if the
# home page declares the output formats, so they are opted into here.
[mediaTypes."text/plain"]
  suffixes = ["txt"]

[outputFormats.LLMS]
  mediaType      = "text/plain"
  baseName       = "llms"
  isPlainText    = true
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "JSON", "LLMS"]

[params]
  authorName = "Jane Doe"  # fictitious example author
  authorURL  = ""          # no real profile in the public demo

  # Appearance
  logo      = "images/hugo-mini-logo-light.svg"
  logoDark  = "images/hugo-mini-logo-dark.svg"
  # avatar      = "images/avatar.svg"        # alternative: personal avatar
  # avatarHover = "images/avatar-hover.svg"   # optional hover/dark variant

  # Footer
  copyrightYear = 2024   # start year: renders as "© 2024–CURRENT"

  # Content
  newPostDays          = 30   # days before "New" badge disappears
  aiTranslatedLang = "en"   # show AI sparkle on English, not Russian

  # Telegram (remove to disable comments widget)
  # telegramChannel = "your_channel"

  # Features
  editorialQuotes = true   # shared editorial style for Markdown quotations
  # socialSharing = false   # uncomment to disable Likely sharing buttons
  # consoleYoda   = true    # uncomment to print a built-in Yoda in the browser console


  # Analytics (all optional — set only the ones you use)
  # yandexMetrikaId   = 123456789
  # googleAnalyticsId = "G-XXXXXXXXXX"
  # plausibleDomain   = "example.com"
  # plausibleSrc      = "https://plausible.io/js/script.js"   # override for self-hosted
  # umamiWebsiteId    = "00000000-0000-0000-0000-000000000000"
  # umamiSrc          = "https://cloud.umami.is/script.js"    # override for self-hosted

  [params.author]
    jobTitle = "Writer"

  [params.social]
    github = "https://github.com/zavarovkv/hugo-mini"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true   # required for shortcodes and HTML in content

[languages]
  [languages.en]
    weight = 1
    label = "EN"
    contentDir = "content/en"
    [languages.en.permalinks]
      blog = "/:slug/"
    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "blog"
        name       = "Articles"
        url        = "/blog/"
        weight     = 1
      [[languages.en.menu.main]]
        identifier = "about"
        name       = "About"
        url        = "/about/"
        weight     = 2
      [[languages.en.menu.main]]
        identifier = "source"
        name       = "Source code"
        url        = "https://github.com/zavarovkv/hugo-mini"
        weight     = 3

  [languages.ru]
    weight = 2
    label = "RU"
    contentDir = "content/ru"
    [languages.ru.permalinks]
      blog = "/:slug/"
    [languages.ru.menu]
      [[languages.ru.menu.main]]
        identifier = "blog"
        name       = "Статьи"
        url        = "/ru/blog/"
        weight     = 1
      [[languages.ru.menu.main]]
        identifier = "about"
        name       = "О проекте"
        url        = "/ru/about/"
        weight     = 2
      [[languages.ru.menu.main]]
        identifier = "source"
        name       = "Исходный код"
        url        = "https://github.com/zavarovkv/hugo-mini"
        weight     = 3

# Use the theme’s light, dark and print syntax palettes.
[markup.highlight]
  noClasses = false
