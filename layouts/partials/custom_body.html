{{- /*
  Override hook for site-level <script> additions that should come AFTER
  the bundled theme JS. Place a custom_body.html in your site's
  layouts/partials/ to add extra scripts.

  The bundled theme JS lives in themes/hugo-mini/assets/js/main.js and is
  loaded by baseof.html via Hugo Pipes (minified + fingerprinted).

  Below is the only piece of theme JS that cannot be moved to the bundled
  asset, because it depends on per-page context (.IsHome) and reads a
  resource at template-evaluation time (the bundled Yoda ASCII art).
*/ -}}
{{- if .IsHome }}
  {{- /* Console art on the home page. Custom art via `params.consoleArt`
         takes priority; otherwise, `params.consoleYoda = true` enables the
         built-in Yoda shipped with the theme (assets/console-yoda.txt). */ -}}
  {{- $art := .Site.Params.consoleArt -}}
  {{- if and (not $art) .Site.Params.consoleYoda -}}
    {{- with resources.Get "console-yoda.txt" -}}
      {{- $art = .Content -}}
    {{- end -}}
  {{- end -}}
  {{- with $art }}
<script>
  (function() {
    console.log('%c' + {{ . | jsonify | safeJS }}, 'color: #0060a0; font-family: monospace; font-size: 13px;');
  })();
</script>
  {{- end }}
{{- end }}
