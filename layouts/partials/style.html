<style>
  :root {
    --width: 720px;
    --font-main: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-secondary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-scale: 1em;
    --background-color: #fff;
    --heading-color: #222;
    --text-color: #444;
    --link-color: #0060a0;
    --visited-color: #8b6fcb;
    --blockquote-color: #222;
  }

  /* Light theme defaults — dark overrides are in custom_head.html */

  body {
    font-family: var(--font-secondary);
    font-size: var(--font-scale);
    font-weight: 300;
    margin: auto;
    padding: 20px;
    max-width: var(--width);
    text-align: left;
    background-color: var(--background-color);
    word-wrap: break-word;
    overflow-wrap: break-word;
    line-height: 1.5;
    color: var(--text-color);
    font-synthesis: weight style;
  }

  h1,
  h2,
  h3,
  h4,
  h5,
  h6 {
    font-family: var(--font-main);
    color: var(--heading-color);
  }

  h1 {
    font-size: 3em;
    font-weight: 400;
    line-height: 1.1;
    margin-bottom: 35px;
    transform: scaleY(1.1);
  }

  h2 {
    font-size: 1.5em;
    font-weight: 500;
    line-height: 1.1;
    margin-top: 35px;
    transform: scaleY(1.05);
  }

  /* Anchor link next to h2/h3 — click to copy section URL.
     Sized down to ~body text, neutral grey by default, reveals on
     heading hover, picks up brand colour on direct hover/copied. */
  .heading-anchor,
  .heading-anchor:link,
  .heading-anchor:visited {
    display: inline-block;
    margin-left: 0.35em;
    font-size: 0.65em;
    font-weight: 400;
    letter-spacing: 0;
    color: #9da2a6;
    opacity: 0;
    text-decoration: none;
    border-bottom: none;
    vertical-align: 0.12em;
    transition: opacity 0.18s ease-out, color 0.18s ease-out;
  }

  h2:hover > .heading-anchor,
  h3:hover > .heading-anchor,
  .heading-anchor:focus {
    opacity: 1;
    outline: none;
  }

  .heading-anchor:hover,
  .heading-anchor:focus-visible {
    color: var(--heading-color);
    text-decoration: none;
    border-bottom: none;
  }

  .heading-anchor.copied {
    opacity: 1;
    color: var(--heading-color);
  }

  /* Touch devices: keep faintly visible since there is no hover */
  @media (hover: none) {
    .heading-anchor,
    .heading-anchor:link,
    .heading-anchor:visited {
      opacity: 0.5;
    }
  }

  /* Title text in header - not a heading */
  .title .title-text {
    color: inherit;
  }

  a {
    color: var(--link-color);
    cursor: pointer;
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  nav a {
    margin-right: 8px;
  }

  strong,
  b {
    color: var(--heading-color);
  }

  button {
    margin: 0;
    cursor: pointer;
  }

  time {
    font-family: monospace;
    font-style: normal;
    font-size: 15px;
  }

  main {
    line-height: 1.6;
  }

  table {
    width: 100%;
  }

  hr {
    border: 0;
    border-top: 1px dashed #ddd;
  }

  img {
    max-width: 100%;
  }

  code {
    font-family: monospace;
    padding: 2px 5px;
    border-radius: 3px;
    font-size: 0.9em;
  }

  .highlight {
    position: relative;
  }

  .highlight pre {
    padding: 16px 20px;
    border-radius: 6px;
    font-size: 0.875em;
    line-height: 1.6;
    overflow-x: auto;
  }

  .highlight pre code {
    padding: 0;
    font-size: inherit;
    background: none;
  }

  .copy-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 32px;
    height: 32px;
    padding: 0;
    border: none;
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.08);
    color: rgba(255, 255, 255, 0.4);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s ease, background 0.2s ease;
  }

  .highlight:hover .copy-btn {
    opacity: 1;
  }

  .copy-btn:hover {
    background: rgba(255, 255, 255, 0.15);
    color: rgba(255, 255, 255, 0.7);
  }

  .copy-btn svg {
    width: 16px;
    height: 16px;
    transition: transform 0.2s ease;
  }

  .copy-btn.copied {
    color: #4ade80;
  }

  .copy-btn.copied svg {
    animation: copy-pop 0.3s ease;
  }

  @keyframes copy-pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }

  blockquote {
    border-left: 1px solid #999;
    color: var(--blockquote-color);
    padding-left: 20px;
    font-style: italic;
  }

  footer {
    padding: 35px 0 25px 0;
    text-align: center;
  }

  .title:hover {
    text-decoration: none;
  }

  .title h1 {
    font-size: 1.5em;
  }

  .inline {
    width: auto;
  }

  .highlight,
  .code {
    margin-block-start: 1em;
    margin-block-end: 1em;
  }

  /* blog post list */
  ul.blog-posts {
    list-style-type: none;
    padding: unset;
  }

  ul.blog-posts li {
    margin-bottom: 0.5em;
  }

  ul.blog-posts li a:visited {
    color: var(--visited-color);
  }

  /* Blog tags */
  .blog-tags {
    font-size: 1.3em;
    font-weight: 200;
    margin-top: 50px;
    margin-bottom: 20px;
    display: block;
  }

  /* KaTeX math formulas */
  .katex {
    font-size: 1.1em;
  }
  
  .katex-display {
    margin: 1.5em 0;
    overflow-x: auto;
    overflow-y: hidden;
  }

  /* Mobile styles */
  @media (max-width: 768px) {
    h1 {
      font-size: 2em;
    }

    h2 {
      font-size: 1.2em;
    }
  }

</style>
