<style>
  :root {
    --width: 720px;
    --font-main: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-secondary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-scale: 1em;
    --background-color: #fff;
    --heading-color: #222;
    --text-color: #444;
    --link-color: #0060a0;
    --visited-color: #8b6fcb;
    --blockquote-color: #222;
  }

  /* Light theme defaults — dark overrides are in custom_head.html */

  body {
    font-family: var(--font-secondary);
    font-size: var(--font-scale);
    margin: auto;
    padding: 20px;
    max-width: var(--width);
    text-align: left;
    background-color: var(--background-color);
    word-wrap: break-word;
    overflow-wrap: break-word;
    line-height: 1.5;
    color: var(--text-color);
    font-synthesis: weight style;
  }

  h1,
  h2,
  h3,
  h4,
  h5,
  h6 {
    font-family: var(--font-main);
    color: var(--heading-color);
  }

  h1 {
    font-size: 3em;
    font-weight: 400;
    line-height: 1.1;
    margin-bottom: 35px;
    transform: scaleY(1.1);
  }

  h2 {
    font-size: 1.5em;
    font-weight: 500;
    line-height: 1.1;
    margin-top: 35px;
    transform: scaleY(1.05);
  }

  /* Title text in header - not a heading */
  .title .title-text {
    color: inherit;
  }

  a {
    color: var(--link-color);
    cursor: pointer;
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  nav a {
    margin-right: 8px;
  }

  strong,
  b {
    color: var(--heading-color);
  }

  button {
    margin: 0;
    cursor: pointer;
  }

  time {
    font-family: monospace;
    font-style: normal;
    font-size: 15px;
  }

  main {
    line-height: 1.6;
  }

  table {
    width: 100%;
  }

  hr {
    border: 0;
    border-top: 1px dashed #ddd;
  }

  img {
    max-width: 100%;
  }

  code {
    font-family: monospace;
    padding: 2px;
    border-radius: 3px;
  }

  blockquote {
    border-left: 1px solid #999;
    color: var(--blockquote-color);
    padding-left: 20px;
    font-style: italic;
  }

  footer {
    padding: 35px 0 25px 0;
    text-align: center;
  }

  .title:hover {
    text-decoration: none;
  }

  .title h1 {
    font-size: 1.5em;
  }

  .inline {
    width: auto;
  }

  .highlight,
  .code {
    border-radius: 3px;
    margin-block-start: 1em;
    margin-block-end: 1em;
    overflow-x: auto;
  }

  /* blog post list */
  ul.blog-posts {
    list-style-type: none;
    padding: unset;
  }

  ul.blog-posts li {
    margin-bottom: 0.5em;
  }

  ul.blog-posts li a:visited {
    color: var(--visited-color);
  }

  /* Blog tags */
  .blog-tags {
    font-size: 1.3em;
    font-weight: 200;
    margin-top: 50px;
    margin-bottom: 20px;
    display: block;
  }

  /* KaTeX math formulas */
  .katex {
    font-size: 1.1em;
  }
  
  .katex-display {
    margin: 1.5em 0;
    overflow-x: auto;
    overflow-y: hidden;
  }

  /* Mobile styles */
  @media (max-width: 768px) {
    h1 {
      font-size: 2em;
    }

    h2 {
      font-size: 1.2em;
    }
  }

</style>
