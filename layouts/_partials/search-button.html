{{- if site.Params.search -}}
{{- $label := i18n "search" | default "Search" -}}
<button type="button" hidden class="search-toggle search-toggle-{{ .variant }}" aria-label="{{ $label }}" title="{{ $label }}" aria-haspopup="dialog" aria-controls="site-search">
  {{- if eq .variant "mobile" -}}
    <span class="nav-label beauty-link-label">{{ $label }}</span>
  {{- else -}}
    {{- with resources.Get "icons/search.svg" -}}{{ .Content | safeHTML }}{{- end -}}
  {{- end -}}
</button>
{{- end -}}
