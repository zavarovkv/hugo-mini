{{- $alt := .Title | default .Site.Title -}}
{{- with partialCached "og-image-resource.html" . .Permalink -}}
<meta property="og:image" content="{{ .Permalink }}" />
<meta property="og:image:type" content="{{ .MediaType.Type }}" />
<meta property="og:image:width" content="{{ .Width }}" />
<meta property="og:image:height" content="{{ .Height }}" />
<meta property="og:image:alt" content="{{ $alt }}" />
<meta name="twitter:image" content="{{ .Permalink }}" />
<meta name="twitter:image:alt" content="{{ $alt }}" />
{{- else -}}
  {{- if fileExists "static/images/og-default.png" -}}
<meta property="og:image" content="{{ "images/og-default.png" | absURL }}" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="{{ $alt }}" />
<meta name="twitter:image" content="{{ "images/og-default.png" | absURL }}" />
<meta name="twitter:image:alt" content="{{ $alt }}" />
  {{- end -}}
{{- end -}}
