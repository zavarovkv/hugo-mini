<div class="project-entry">
  <h3 class="project-title">
    {{- with .Get "icon" }}
    <button class="project-mark-button" type="button" disabled aria-label="{{ i18n "spin_project_logo" (dict "Name" ($.Get "name")) }}">
      <span class="project-mark{{ with $.Get "iconDark" }} has-dark-mark{{ end }}" aria-hidden="true">
        <img class="project-mark-light" src="{{ partial "static-asset-url.html" . }}" alt="" width="18" height="18" loading="lazy" decoding="async">
        {{- with $.Get "iconDark" }}
        <img class="project-mark-dark" src="{{ partial "static-asset-url.html" . }}" alt="" width="18" height="18" loading="lazy" decoding="async">
        {{- end }}
      </span>
    </button>
    {{- end }}
    <a class="project-link" href="{{ .Get "url" }}" target="_blank" rel="noopener noreferrer">
      <span class="project-name beauty-link-label">{{ .Get "name" }}</span><span class="project-arrow beauty-link-icon" aria-hidden="true">{{ partial "link-arrow.html" "external" }}</span>
    </a>
  </h3>
  <div class="project-description">
    {{ .Page.RenderString (dict "display" "block") .Inner }}
  </div>
</div>
