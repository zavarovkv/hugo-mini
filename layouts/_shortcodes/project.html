<div class="project-entry">
  <h3 class="project-title">
    <a class="project-link" href="{{ .Get "url" }}" target="_blank" rel="noopener noreferrer">
      {{- with .Get "icon" }}
      <span class="project-mark{{ with $.Get "iconDark" }} has-dark-mark{{ end }}" aria-hidden="true">
        <img class="project-mark-light" src="{{ . | relURL }}" alt="" width="18" height="18" loading="lazy" decoding="async">
        {{- with $.Get "iconDark" }}
        <img class="project-mark-dark" src="{{ . | relURL }}" alt="" width="18" height="18" loading="lazy" decoding="async">
        {{- end }}
      </span>
      {{- end }}
      <span class="project-name beauty-link-label">{{ .Get "name" }}</span><span class="project-arrow beauty-link-icon" aria-hidden="true">↗</span>
    </a>
  </h3>
  <div class="project-description">
    {{ .Page.RenderString (dict "display" "block") .Inner }}
  </div>
</div>
