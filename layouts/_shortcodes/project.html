<div class="project-entry">
  <h3 class="project-title">
    <a class="project-link" href="{{ .Get "url" }}" target="_blank" rel="noopener noreferrer"><span class="project-name">{{ .Get "name" }}</span><span class="project-arrow" aria-hidden="true">↗</span></a>
  </h3>
  <div class="project-description">
    {{ .Page.RenderString (dict "display" "block") .Inner }}
  </div>
</div>
