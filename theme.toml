name = "Mini"
license = "MIT"
licenselink = "https://github.com/zavarovkv/hugo-mini/blob/main/LICENSE"
description = "A fast, writer-first multilingual Hugo blog theme. Lighthouse 100 out of the box, zero runtime dependencies, self-hosted Inter font, dark mode with system preference, KaTeX math and Mermaid diagrams, dynamic 1200×630 OG images, Telegram comments and reactions, JSON Feed and llms.txt for AI crawlers."
homepage = "https://github.com/zavarovkv/hugo-mini"
demosite = "https://zavarov.com/"
tags = [
    "blog",
    "minimal",
    "clean",
    "personal",
    "writer",
    "typography",
    "dark",
    "light",
    "responsive",
    "multilingual",
    "markdown",
    "seo",
    "accessible",
    "telegram",
    "math",
    "katex",
    "mermaid",
]
features = [
    "dark-light-mode",
    "i18n",
    "telegram-comments",
    "telegram-reactions",
    "katex-math",
    "mermaid-diagrams",
    "og-images",
    "social-sharing",
    "json-feed",
    "llms-txt",
    "rss",
    "code-copy-button",
    "heading-anchors",
    "recent-posts-sidebar",
    "pinned-posts",
    "analytics",
    "seo-jsonld",
]
min_version = "0.145.0"

[author]
name = "Konstantin Zavarov"
homepage = "https://zavarov.com"
