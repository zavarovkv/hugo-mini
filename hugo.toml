[module.hugoVersion]
extended = true
# 0.146.0 is the first release with the current template system, which this
# theme's layout relies on (layouts/_partials, _shortcodes, _markup, and
# baseof/home/list/single at the layouts root).
min = "0.146.0"

[params]
  sideNotes = false
  articleLinksNewTab = false
  typography = true
  hangingQuotes = false
  proseNumerals = false
  showSearchButton = true
  preferenceCookieDomain = ""
  rememberLanguage = false
