name: Test example site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.145.0'
          extended: true

      - name: Build exampleSite
        # --themesDir ../.. tells Hugo to look for the theme one level above
        # the theme repo itself, so `theme = "hugo-mini"` in exampleSite/config.toml
        # resolves to the checked-out repo root.
        run: hugo -s exampleSite --themesDir ../.. --minify
