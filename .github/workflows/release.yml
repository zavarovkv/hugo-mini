# Creates a git tag + GitHub release when .github/RELEASE_TAG changes on
# main (the file holds the tag name, e.g. "v1.0.2"). Also available as a
# manual workflow_dispatch. Exists because some CI/agent environments can
# push branches but not tags — this delegates tag creation to a runner
# with the repo-scoped GITHUB_TOKEN. Creating an existing release is a
# no-op, so re-pushing the file or re-running the job is safe.
name: Release

on:
  push:
    branches: [main]
    paths: [".github/RELEASE_TAG"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create (e.g. v1.0.2); defaults to .github/RELEASE_TAG"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG="$(tr -d '[:space:]' < .github/RELEASE_TAG)"
          fi
          git check-ref-format "refs/tags/$TAG"
          echo "Tag: $TAG"
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            exit 0
          fi
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --generate-notes
